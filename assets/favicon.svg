<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing outer neural ring G shape (sem fundo) -->
  <path d="M 68 24 C 62 16 50 14 38 18 C 22 24 14 40 18 58 C 22 74 38 84 56 82 C 72 79 84 66 84 50 L 50 50 L 50 40 L 92 40 C 94 62 80 88 54 92 C 28 96 8 80 4 54 C 0 28 18 6 44 4 C 60 2 76 8 84 20 Z" 
        fill="url(#glowGrad)" 
        filter="url(#neonGlow)"/>

  <!-- Core futuristic AI Spark (Estrela de 4 pontas no centro) -->
  <path d="M 50 26 Q 50 38 38 38 Q 50 38 50 50 Q 50 38 62 38 Q 50 38 50 26 Z" 
        fill="url(#sparkGrad)" />

  <!-- Neural node satellites -->
  <circle cx="84" cy="20" r="4.5" fill="#2dd4bf" />
  <circle cx="50" cy="50" r="4" fill="#ffffff" />
  <circle cx="92" cy="40" r="4" fill="#10a37f" />
</svg>
