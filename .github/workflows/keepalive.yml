name: Keep Alive Render

on:
  schedule:
    # Executa a cada 10 minutos para não deixar o Render dormir
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -s https://gustavo-ia-api.onrender.com > /dev/null || true
